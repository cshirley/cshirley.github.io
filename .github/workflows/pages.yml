name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Daily rebuild so future-dated (scheduled) posts publish on their date.
  # Posts are dated 09:00 UK time (08:00 UTC in summer, 09:00 UTC in winter), so the run must
  # come after 09:00 UTC to publish them on the day all year round.
  # Off-the-hour minute: GitHub delays/drops top-of-hour cron runs under load.
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Content doesn't change between pushes, so the daily scheduled rebuild skips this.
      - name: Spell check (cspell + British -ise style)
        if: github.event_name != 'schedule'
        run: npm run check:spelling
      - name: Check agent skills (.agents/skills, AGENTS.md)
        if: github.event_name != 'schedule'
        run: npm run check:skills
      # Medium import copies of every live post, written to public/medium/ so the build deploys
      # them. Uses the runner's Google Chrome. Never blocks the site: if it fails, the smoke
      # test reports the missing copies after deploy.
      - name: Generate Medium import copies
        run: npm run medium -- --all --live --publish
        continue-on-error: true
      # Fails on invalid front matter (src/content.config.ts, src/data/taxonomy.ts).
      - run: npm run build
      # Post-build checks block deploys on push and PRs. On the daily scheduled rebuild they only
      # report, so a check can't hold back a scheduled post.
      - name: Check internal links
        run: npm run check:links
        continue-on-error: ${{ github.event_name == 'schedule' }}
      - name: Check published URLs still exist
        run: npm run check:urls
        continue-on-error: ${{ github.event_name == 'schedule' }}
      # Drafts and scheduled posts aren't in dist/, so check their links in a separate build.
      - name: Check links in drafts and scheduled posts
        if: github.event_name != 'schedule'
        run: npm run check:links:drafts
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # Fetch every sitemap URL plus the feed from the live site. Runs on scheduled rebuilds too,
      # to confirm a scheduled post went live. The script uses only Node built-ins (no npm ci).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Smoke test live site
        run: node scripts/smoke-test.mjs "${{ steps.deployment.outputs.page_url }}"
